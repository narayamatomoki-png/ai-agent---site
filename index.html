<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI Agent Factory</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080d1a;
  color:#fff;
}

.container{
  max-width:900px;
  margin:auto;
  padding:18px;
}

header{
  text-align:center;
  padding:25px 0;
}

h1{
  margin:0;
  font-size:29px;
}

.subtitle{
  color:#9ca3af;
  margin-top:8px;
}

.status{
  display:inline-block;
  margin-top:15px;
  padding:7px 14px;
  border-radius:20px;
  background:#12351f;
  color:#4ade80;
  font-size:14px;
}

.card{
  background:#121a2d;
  border:1px solid #27314a;
  border-radius:18px;
  padding:18px;
  margin-top:18px;
}

h2{
  font-size:18px;
  margin-top:0;
}

textarea{
  width:100%;
  min-height:130px;
  background:#090f1e;
  color:white;
  border:1px solid #303b57;
  border-radius:12px;
  padding:15px;
  font-size:16px;
  resize:vertical;
}

button{
  border:0;
  border-radius:12px;
  padding:14px 18px;
  font-size:15px;
  cursor:pointer;
}

.run{
  width:100%;
  margin-top:12px;
  background:#6366f1;
  color:white;
  font-weight:bold;
}

.clear{
  width:100%;
  margin-top:8px;
  background:#252f48;
  color:#ddd;
}

.employees{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.employee{
  background:#090f1e;
  border:1px solid #27314a;
  border-radius:14px;
  padding:15px;
}

.icon{
  font-size:27px;
}

.name{
  font-weight:bold;
  margin-top:7px;
}

.job{
  color:#9ca3af;
  font-size:13px;
  margin-top:4px;
}

.waiting{
  color:#9ca3af;
  margin-top:8px;
}

.working{
  color:#facc15;
  margin-top:8px;
}

.done{
  color:#4ade80;
  margin-top:8px;
}

.result{
  background:#090f1e;
  border-radius:12px;
  padding:17px;
  min-height:180px;
  white-space:pre-wrap;
  line-height:1.8;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.actions button{
  flex:1;
  background:#252f48;
  color:white;
}

.history-item{
  padding:13px 0;
  border-bottom:1px solid #27314a;
}

.history-item:last-child{
  border-bottom:0;
}

.small{
  color:#9ca3af;
  font-size:12px;
}

.badge{
  display:inline-block;
  background:#252f48;
  padding:5px 9px;
  border-radius:8px;
  font-size:12px;
  margin-top:8px;
}

@media(max-width:600px){
  .employees{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>🤖 My AI Agent Factory</h1>
  <div class="subtitle">
    あなたの指示からコンテンツを作るAI社員チーム
  </div>

  <div class="status" id="status">
    ● システム準備完了
  </div>
</header>


<div class="card">

<h2>🎯 AIへの指示</h2>

<textarea
id="instruction"
placeholder="例：中学生向けのAIについてのnote記事を作って"
></textarea>

<button class="run" id="run">
🚀 AI社員を稼働させる
</button>

<button class="clear" id="clear">
クリア
</button>

</div>


<div class="card">

<h2>👨‍💻 AI社員チーム</h2>

<div class="employees">

<div class="employee">
<div class="icon">🧠</div>
<div class="name">企画社員</div>
<div class="job">テーマ・構成を考える</div>
<div id="e1" class="waiting">待機中</div>
</div>

<div class="employee">
<div class="icon">✍️</div>
<div class="name">ライター社員</div>
<div class="job">記事を作成する</div>
<div id="e2" class="waiting">待機中</div>
</div>

<div class="employee">
<div class="icon">🔍</div>
<div class="name">チェック社員</div>
<div class="job">記事を確認する</div>
<div id="e3" class="waiting">待機中</div>
</div>

<div class="employee">
<div class="icon">📱</div>
<div class="name">SNS社員</div>
<div class="job">SNS投稿を作る</div>
<div id="e4" class="waiting">待機中</div>
</div>

</div>
</div>


<div class="card">

<h2>📝 作業結果</h2>

<div class="result" id="result">
まだ作業は開始されていません。
</div>

<div class="actions">

<button id="copy">
📋 コピー
</button>

<button id="save">
💾 保存
</button>

</div>

</div>


<div class="card">

<h2>📚 作業履歴</h2>

<div id="history">
<div class="small">
まだ履歴はありません。
</div>
</div>

</div>

</div>


<script>

const instruction =
document.getElementById("instruction");

const result =
document.getElementById("result");

const status =
document.getElementById("status");

const run =
document.getElementById("run");

const clear =
document.getElementById("clear");

const copy =
document.getElementById("copy");

const save =
document.getElementById("save");

const history =
document.getElementById("history");

const employees = [
document.getElementById("e1"),
document.getElementById("e2"),
document.getElementById("e3"),
document.getElementById("e4")
];

let historyData =
JSON.parse(
localStorage.getItem("aiAgentHistory") || "[]"
);


function wait(ms){
return new Promise(
resolve => setTimeout(resolve,ms)
);
}


function setEmployee(index,text,type){

employees[index].textContent = text;

employees[index].className = type;

}


function createDemoArticle(text){

return `【note記事 完成プレビュー】

━━━━━━━━━━━━━━

📌 タイトル

中学生でもわかる！
${text.replace("作って","")}の基本

━━━━━━━━━━━━━━

🎯 読者

AIや新しい技術に興味がある中学生

━━━━━━━━━━━━━━

📝 はじめに

最近、AIという言葉を聞く機会が増えています。

学校やニュース、SNSなど、
さまざまな場所でAIが使われるようになりました。

この記事では、AIについて
中学生でもわかりやすいように紹介します。

━━━━━━━━━━━━━━

📖 第1章
AIって何？

AIとは、人間が行っているような
「考える」「文章を作る」「画像を認識する」
などの作業をコンピューターに行わせる技術です。

━━━━━━━━━━━━━━

📖 第2章
AIで何ができる？

AIを使うと、

・文章を作る
・アイデアを考える
・勉強をサポートする
・画像を作る
・動画の台本を作る

など、さまざまなことができます。

━━━━━━━━━━━━━━

📖 第3章
AIを使うときに大切なこと

AIの答えが必ず正しいとは限りません。

そのため、

「AIが言ったから正しい」

と考えるのではなく、
自分でも情報を確認することが大切です。

━━━━━━━━━━━━━━

📌 まとめ

AIは、使い方次第で
勉強や創作を助けてくれる便利な道具です。

大切なのは、
AIに全部任せるのではなく、
自分の考えと組み合わせて使うことです。

━━━━━━━━━━━━━━

📱 SNS投稿文

「AIって何ができるの？」

そんな疑問を持つ中学生向けに、
AIの基本をわかりやすくまとめました！

勉強や文章作成など、
AIにはいろいろな使い道があります。

#AI
#中学生
#note
#勉強

━━━━━━━━━━━━━━

🔍 チェック結果

✅ 読みやすさ
✅ 中学生向けの表現
✅ 記事構成
✅ SNS投稿文

※現在はAPIなしのデモ生成です。
`;
}


run.addEventListener("click",async()=>{

const text =
instruction.value.trim();

if(!text){

result.textContent =
"まずAIへの指示を入力してください。";

return;

}


run.disabled = true;

status.textContent =
"● AI社員が作業中...";

status.style.color =
"#facc15";


employees.forEach(e=>{
e.textContent="待機中";
e.className="waiting";
});


setEmployee(
0,
"分析中...",
"working"
);

result.textContent =
"🧠 企画社員が指示を分析しています...";

await wait(1000);


setEmployee(
0,
"完了",
"done"
);

setEmployee(
1,
"執筆中...",
"working"
);

result.textContent =
"✍️ ライター社員が記事を作成しています...";

await wait(1200);


setEmployee(
1,
"完了",
"done"
);

setEmployee(
2,
"チェック中...",
"working"
);

result.textContent =
"🔍 チェック社員が記事を確認しています...";

await wait(1000);


setEmployee(
2,
"完了",
"done"
);

setEmployee(
3,
"作成中...",
"working"
);

result.textContent =
"📱 SNS社員が投稿文を作っています...";

await wait(1000);


setEmployee(
3,
"完了",
"done"
);


const article =
createDemoArticle(text);

result.textContent =
article;


historyData.unshift({

instruction:text,

result:article,

time:new Date()
.toLocaleString("ja-JP")

});


historyData =
historyData.slice(0,10);


localStorage.setItem(
"aiAgentHistory",
JSON.stringify(historyData)
);


renderHistory();


status.textContent =
"● 作業完了";

status.style.color =
"#4ade80";


run.disabled=false;

});


clear.addEventListener(
"click",
()=>{

instruction.value="";

result.textContent =
"まだ作業は開始されていません。";

employees.forEach(e=>{
e.textContent="待機中";
e.className="waiting";
});

status.textContent =
"● システム準備完了";

status.style.color =
"#4ade80";

}
);


copy.addEventListener(
"click",
async()=>{

await navigator.clipboard
.writeText(result.textContent);

copy.textContent =
"✅ コピーしました";

setTimeout(()=>{
copy.textContent="📋 コピー";
},1500);

}
);


save.addEventListener(
"click",
()=>{

localStorage.setItem(
"aiAgentLastResult",
result.textContent
);

save.textContent =
"✅ 保存しました";

setTimeout(()=>{
save.textContent="💾 保存";
},1500);

}
);


function renderHistory(){

if(historyData.length===0){

history.innerHTML =
'<div class="small">まだ履歴はありません。</div>';

return;

}


history.innerHTML =
historyData.map(item=>`

<div class="history-item">

<div>
📝 ${item.instruction}
</div>

<div class="small">
${item.time}
</div>

</div>

`).join("");

}


renderHistory();

</script>

</body>
</html>
