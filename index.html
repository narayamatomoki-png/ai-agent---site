<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Agent</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .status {
      text-align: center;
      color: #18a558;
      margin-bottom: 20px;
    }

    textarea {
      width: 100%;
      height: 150px;
      padding: 15px;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
    }

    #run {
      background: #111827;
      color: white;
    }

    #clear {
      background: #e5e7eb;
    }

    .result {
      margin-top: 25px;
      background: white;
      padding: 20px;
      border-radius: 12px;
      white-space: pre-wrap;
      line-height: 1.7;
      min-height: 100px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🤖 My AI Agent</h1>

  <div class="status">● 準備完了</div>

  <textarea
    id="instruction"
    placeholder="AIにやってほしいことを書いてください。&#10;&#10;例：中学生向けのnote記事を作って"
  ></textarea>

  <button id="run">🚀 エージェントを実行</button>

  <button id="clear">クリア</button>

  <div class="result" id="result">
    ここにAIの結果が表示されます。
  </div>

</div>

<script>

const WORKER_URL =
  "https://my-ai-agent-server.narayamatomoki.workers.dev";

const instruction = document.getElementById("instruction");
const result = document.getElementById("result");
const runButton = document.getElementById("run");
const clearButton = document.getElementById("clear");

runButton.addEventListener("click", async () => {

  const text = instruction.value.trim();

  if (!text) {
    result.textContent = "まずAIへの指示を入力してください。";
    return;
  }

  runButton.disabled = true;
  runButton.textContent = "⏳ AIが実行中...";
  result.textContent = "AIに指示を送っています...";

  try {

    const response = await fetch(WORKER_URL, {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        instruction: text
      })
    });

    const data = await response.json();

    if (!response.ok || !data.ok) {
      result.textContent =
        "エラーが発生しました。\n\n" +
        JSON.stringify(data, null, 2);
      return;
    }

    const output =
      data.result?.output_text ||
      JSON.stringify(data.result, null, 2);

    result.textContent = output;

  } catch (error) {

    result.textContent =
      "サーバーに接続できませんでした。\n\n" +
      error.message;

  } finally {

    runButton.disabled = false;
    runButton.textContent = "🚀 エージェントを実行";

  }

});

clearButton.addEventListener("click", () => {
  instruction.value = "";
  result.textContent = "ここにAIの結果が表示されます。";
});

</script>

</body>
</html>
