<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>My AI Agent</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827}
.app{max-width:680px;margin:auto;min-height:100vh;background:#fff}
header{padding:22px 18px 16px;background:#111827;color:#fff;position:sticky;top:0;z-index:2}
h1{font-size:24px;margin:0 0 5px}.status{font-size:13px;color:#a7f3d0}
main{padding:18px}.card{border:1px solid #e5e7eb;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 3px 12px #0000000a}
label{font-weight:700;display:block;margin-bottom:9px}textarea{width:100%;min-height:125px;border:1px solid #d1d5db;border-radius:13px;padding:13px;font-size:16px;resize:vertical;outline:none}
textarea:focus{border-color:#6366f1;box-shadow:0 0 0 3px #6366f122}
.buttons{display:flex;gap:9px;margin-top:11px}button{border:0;border-radius:12px;padding:13px 16px;font-size:15px;font-weight:700;cursor:pointer}
#run{background:#4f46e5;color:#fff;flex:1}#clear{background:#e5e7eb;color:#111827}
ul{padding-left:22px;margin:8px 0}.step{margin:9px 0}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#d1d5db;margin-right:8px}.done .dot{background:#10b981}.working .dot{background:#f59e0b}
#result{white-space:pre-wrap;line-height:1.65;color:#374151;min-height:55px}
.small{font-size:12px;color:#6b7280;line-height:1.5}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>🤖 My AI Agent</h1>
  <div class="status" id="status">● 準備完了</div>
</header>
<main>
  <section class="card">
    <label for="instruction">何をしてほしい？</label>
    <textarea id="instruction" placeholder="例：中学生向けのnote記事を作って"></textarea>
    <div class="buttons">
      <button id="run">🚀 エージェントを実行</button>
      <button id="clear">クリア</button>
    </div>
  </section>

  <section class="card">
    <label>📋 実行状況</label>
    <div class="step" id="s1"><span class="dot"></span>指示を理解する</div>
    <div class="step" id="s2"><span class="dot"></span>必要な作業を計画する</div>
    <div class="step" id="s3"><span class="dot"></span>記事を作成する</div>
    <div class="step" id="s4"><span class="dot"></span>内容をチェックする</div>
  </section>

  <section class="card">
    <label>📄 結果</label>
    <div id="result">ここにエージェントの結果が表示されます。</div>
  </section>

  <p class="small">現在はブラウザだけで動く試作版です。AI APIを接続すると、本物のAIエージェントとして動かせます。</p>
</main>
</div>
<script>
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function resetSteps(){["s1","s2","s3","s4"].forEach(x=>$(x).className="step")}
$("clear").onclick=()=>{ $("instruction").value=""; $("result").textContent="ここにエージェントの結果が表示されます。"; $("status").textContent="● 準備完了"; resetSteps(); };
$("run").onclick=async()=>{
 const text=$("instruction").value.trim();
 if(!text){$("result").textContent="まず指示を入力してください。";return}
 $("run").disabled=true; $("status").textContent="● 実行中…"; resetSteps();
 for(const id of ["s1","s2","s3","s4"]){$(id).classList.add("working");await sleep(450);$(id).classList.remove("working");$(id).classList.add("done")}
 $("result").textContent="試作版の実行が完了しました。\\n\\n受け取った指示：\\n"+text+"\\n\\n次の段階でAIモデルを接続すると、この指示をもとに実際の記事作成・調査・チェックなどを自動化できます。";
 $("status").textContent="● 実行完了"; $("run").disabled=false;
};
</script>
</body>
</html>
